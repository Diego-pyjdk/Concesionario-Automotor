[pytest]
# Las pruebas viven en tests/ y se ejecutan con:
#
#     venv\Scripts\python.exe -m pytest
#
# -q es el modo corto (una linea por resultado).
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Los avisos de PySide6 sobre la falta de
# pantalla ensucian la salida sin aportar nada:
# las pruebas no dibujan.
filterwarnings =
    ignore::DeprecationWarning

addopts = -q --tb=short